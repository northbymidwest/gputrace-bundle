name: mutants

# Mutation-tests the parser: cargo-mutants injects small changes and checks the
# suite catches them. A surviving mutant is a parser line no test observes.
# This is a report, not a per-commit verdict.
on:
  push:
  pull_request:
  schedule:
    - cron: '43 7 * * 1'
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Override the survivor baseline (to exercise the reporting path)'
        type: string
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # No surviving mutants: every mutation the tests do not catch has a test
      # that kills it. Any survivor is a real gap - add a test, do not raise
      # this. (Raising needs a reason in the commit that does it.)
      BASELINE: ${{ inputs.baseline || '0' }}
      # Keep the corpus fuzz deterministic and cheap during mutation runs, so a
      # mutant's caught/survived verdict does not flicker between runs.
      FUZZ_SEED: '1'
      FUZZ_ITERS: '200'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-mutants@27.1.0
      - id: mutate
        env:
          NO_COLOR: '1'
        run: |
          set -o pipefail
          cargo mutants --no-shuffle 2>&1 | tee mutants.log && status=0 || status=$?
          # exit 2 = surviving mutants found (normal); anything else is fatal.
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "::error::cargo mutants exited $status"; exit "$status"
          fi
          missed=$(grep -c '^MISSED' mutants.log || true)
          echo "missed=$missed" >> "$GITHUB_OUTPUT"
          echo "surviving mutants: $missed (baseline $BASELINE)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$missed" -gt "$BASELINE" ]; then
            echo "::error::$missed surviving mutants, above baseline $BASELINE"
            echo "regression=true" >> "$GITHUB_OUTPUT"
            exit 1
          elif [ "$missed" -lt "$BASELINE" ]; then
            echo "::notice::$missed surviving mutants, below baseline $BASELINE - lower BASELINE"
          fi
      - name: File a survivor regression
        if: always() && steps.mutate.outputs.regression == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          MISSED: ${{ steps.mutate.outputs.missed }}
        run: |
          title="mutants: surviving mutants above the baseline"
          body=$(printf 'cargo-mutants found %s surviving mutants, above the baseline of %s (run %s).\n' \
            "$MISSED" "$BASELINE" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          existing=$(gh issue list --state open --label ci-failure --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label ci-failure --body "$body"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants
          path: |
            mutants.log
            mutants.out/outcomes.json
          if-no-files-found: warn
