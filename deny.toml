# cargo-deny config. Run in CI as `cargo deny check licenses bans sources`.
# Advisories are handled separately by audit.yml.

[graph]
all-features = false

[licenses]
# The union of every SPDX license in the resolved tree.
allow = [
    "0BSD",
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
]
unused-allowed-license = "deny"
private = { ignore = true }

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
