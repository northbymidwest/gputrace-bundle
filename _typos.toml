# Spell-check allow-list for the `typos` CLI (and the CI typos check).
#
# Entries are added only as CI (or a local `typos` run) surfaces a genuine
# false positive, such as a crate name or a deliberate spelling used as an
# identifier. Do not add real misspellings here; fix those in the source.

[default.extend-identifiers]

[default.extend-words]
# `flate2`, the zlib crate: the fragment `flate` is not a typo of `flat`.
flate = "flate"
